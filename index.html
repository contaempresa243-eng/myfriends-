<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myFriens</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="app-container">
    
    <!-- Ecrã de Login / Número de Telemóvel -->
    <div id="login-screen" class="screen" style="display:flex; flex-direction:column; justify-content:center; padding:30px; height:100%; text-align:center;">
      <div style="font-size:40px; color:var(--whatsapp-teal); margin-bottom:20px;"><i class="fa-solid fa-comments"></i></div>
      <h2 style="color:#e9edef; margin-bottom:10px;">myFriens</h2>
      <p style="color:#8696a0; font-size:14px; margin-bottom:30px;">Insere o teu número de telemóvel com o código do país para entrar.</p>
      
      <input type="tel" id="phone-input" placeholder="+244 9XX XXX XXX" style="width:100%; padding:14px; background:#2a3942; border:none; border-radius:8px; color:#fff; font-size:16px; margin-bottom:15px; text-align:center; outline:none;">
      
      <button id="btn-send-code" onclick="bypassLogin()"
 style="width:100%; padding:14px; background:var(--whatsapp-teal); border:none; border-radius:8px; color:#fff; font-weight:bold; font-size:16px; cursor:pointer; margin-bottom:15px;">Avançar</button>
      
      <!-- Campo de confirmação do Código SMS (Oculto inicialmente) -->
      <div id="otp-container" class="hidden">
        <input type="text" id="otp-input" placeholder="Código de 6 dígitos" style="width:100%; padding:14px; background:#2a3942; border:none; border-radius:8px; color:#fff; font-size:16px; margin-bottom:15px; text-align:center; outline:none;">
        <button onclick="verifyOTP()" style="width:100%; padding:14px; background:var(--whatsapp-teal); border:none; border-radius:8px; color:#fff; font-weight:bold; font-size:16px; cursor:pointer;">Confirmar Código</button>
      </div>

      <!-- Container invisível obrigatório para o reCAPTCHA do Firebase -->
      <div id="recaptcha-container"></div>
    </div>

    <!-- Ecrã Principal (Oculto até fazer login) -->
    <div id="main-screen" class="screen hidden" style="display:none; flex-direction:column; height:100%;">
      <header>
        <h1>myFriens</h1>
        <div class="header-icons">
          <span class="fa-solid fa-camera" title="Câmara"></span>
          <span class="fa-solid fa-magnifying-glass" title="Pesquisar"></span>
          <span class="fa-solid fa-ellipsis-vertical" id="menu-toggle" onclick="toggleMenu()"></span>
        </div>
        <div id="dropdown-menu" class="dropdown-menu hidden">
          <div onclick="openSettings()">Definições</div>
          <div onclick="logoutUser()">Terminar Sessão</div>
        </div>
      </header>

      <div class="nav-tabs">
        <div class="tab-item active" data-target="chats" onclick="switchTab('chats', this)">Conversas</div>
        <div class="tab-item" data-target="updates" onclick="switchTab('updates', this)">Atualizações</div>
        <div class="tab-item" data-target="communities" onclick="switchTab('communities', this)">Comunidades</div>
        <div class="tab-item" data-target="calls" onclick="switchTab('calls', this)">Ligações</div>
      </div>

      <div class="content-area" id="tab-content"></div>
    </div>

    <!-- Ecrã de Conversa Detalhada -->
    <div id="chat-room-screen" class="screen hidden" style="display:none; flex-direction:column; height:100%; background:var(--whatsapp-chat-bg);">
      <header style="background:var(--whatsapp-panel);">
        <div style="display:flex; align-items:center;">
          <span class="fa-solid fa-arrow-left" onclick="closeChat()" style="margin-right:15px; cursor:pointer; color:#aebac1;"></span>
          <div class="avatar" id="active-chat-avatar" style="width:35px; height:35px; font-size:14px; margin-right:10px;">MF</div>
          <h3 id="active-chat-name" style="font-size:16px; color:#e9edef;">Chat</h3>
        </div>
        <div class="header-icons">
          <span class="fa-solid fa-video" onclick="startVideoCall()" style="margin-right:15px;"></span>
          <span class="fa-solid fa-phone" onclick="startVoiceCall()" style="margin-right:15px;"></span>
          <span class="fa-solid fa-paperclip" onclick="triggerFileUpload()"></span>
        </div>
      </header>
      
      <div id="messages-container" style="flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;">
        <!-- Mensagens em tempo real injetadas aqui -->
      </div>
      
      <div style="padding:10px; background:var(--whatsapp-panel); display:flex; align-items:center;">
        <input type="text" id="message-input" placeholder="Mensagem" style="flex:1; padding:10px 14px; background:#2a3942; border:none; border-radius:8px; color:#fff; outline:none;">
        <span class="fa-solid fa-paper-plane" style="margin-left:15px; color:var(--whatsapp-teal); font-size:18px; cursor:pointer;" onclick="sendFirebaseMessage()"></span>
      </div>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
